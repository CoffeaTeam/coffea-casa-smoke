name: AGC upstream check

on:
  pull_request:
    paths: ["agc/**"]
  push:
    branches: [main]
    paths: ["agc/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fails when agc/ was edited without recording the change in agc/_sync/patches/.
      - run: python agc/_sync/sync.py check
